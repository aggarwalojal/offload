# One always-on service for the hackathon: web + parser + durable queue worker.
# Paid compute: review Render pricing before applying this Blueprint.
services:
  - type: web
    name: offload-backend
    runtime: python
    branch: main
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r backend/requirements.txt -r backend/requirements-whatsapp.txt
    startCommand: uvicorn backend.hosted:create_hosted_app --factory --host 0.0.0.0 --port $PORT --workers 1 --no-access-log --no-proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SUPABASE_URL
        value: https://bhoifpepjluvdvsqgtkw.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
